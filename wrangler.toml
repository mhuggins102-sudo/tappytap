# Cloudflare Pages + Functions configuration.
#
# The D1 binding is configured through the Pages dashboard (Settings →
# Functions → D1 database bindings), not in this file. The binding name
# must be "DB" so it matches `env.DB` in the Functions code.
#
# To add a local D1 binding for `wrangler pages dev`, append a block like
# this (replace database_id with your real D1 UUID from the dashboard —
# the UUID inside the database's Settings tab, not the account UUID in
# the URL):
#
#   [[d1_databases]]
#   binding = "DB"
#   database_name = "tappytap"
#   database_id = "<your-database-uuid>"
name = "tappytap"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"
